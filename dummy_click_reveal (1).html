<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #f3f4f6; color: #202124; font-family: Arial, Helvetica, sans-serif;
    }
    .chat {
      width: min(440px, 100%); background: white; border-radius: 20px; padding: 26px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }
    .bubble { background: #f1f3f4; border-radius: 16px 16px 16px 4px; padding: 16px 18px; line-height: 1.55; }
    button {
      display: inline-block; margin-top: 18px; border: 0; border-radius: 999px; padding: 12px 20px;
      background: #2563eb; color: white; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #more { display: none; margin-top: 18px; animation: show .35s ease both; }
    #more .bubble { background: #e8f0fe; }
    @keyframes show { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <main class="chat">
    <div class="bubble">Hi! 👋<br>How are you? Hope you're doing good!</div>
    <button id="revealButton" type="button">Click here 😊</button>
    <section id="more" aria-live="polite">
      <div class="bubble">Heyyy! 😄<br>What's up? How's everything going?</div>
    </section>
  </main>
  <script>
    const button = document.getElementById('revealButton');
    const more = document.getElementById('more');
    button.addEventListener('click', () => {
      more.style.display = 'block';
      button.textContent = 'Opened ✓';
      button.disabled = true;
    });
  </script>
</body>
</html>
